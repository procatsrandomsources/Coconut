<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoconutSMP | Official Minecraft Server</title>

  <!-- Google Search Site Name Schema Fix -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "CoconutSMP",
    "alternateName": ["Coconut SMP", "CoconutSMP Minecraft"],
    "url": "https://coconutsmp.qzz.io/"
  }
  </script>

  <!-- Open Graph & Meta Tags -->
  <meta property="og:site_name" content="CoconutSMP">
  <meta property="og:title" content="CoconutSMP | Official Minecraft Server">
  <meta property="og:description" content="WELCOME TO COCONUTSMP - Connect from Java, Bedrock, VR, Web Browsers & Cracked Clients.">
  <meta name="description" content="Official CoconutSMP Minecraft server website. Join via PC, Mobile, Console, or Cracked Clients.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 30px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #4caf50;
    }
    p.subtitle {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .ip-box {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }
    .ip-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .ip-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #888;
      font-weight: bold;
    }
    .ip-text {
      font-family: monospace;
      font-size: 0.95rem;
      color: #fff;
      word-break: break-all;
    }
    button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 10px;
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>CoconutSMP</h1>
    <p class="subtitle">Connect from Java, Bedrock, Consoles, & Cracked Clients!</p>

    <!-- Main Domain IP -->
    <div class="ip-box">
      <div class="ip-details">
        <span class="ip-label">Main Java & Bedrock IP</span>
        <span class="ip-text" id="main-ip">play.coconutsmp.qzz.io</span>
      </div>
      <button onclick="copyToClipboard('main-ip', this)">Copy</button>
    </div>

    <!-- Alternative IP -->
    <div class="ip-box">
      <div class="ip-details">
        <span class="ip-label">Alt Fallback IP</span>
        <span class="ip-text" id="alt-ip">mc.coconutsmp.qzz.io</span>
      </div>
      <button onclick="copyToClipboard('alt-ip', this)">Copy</button>
    </div>

    <!-- Cracked Client IP -->
    <div class="ip-box">
      <div class="ip-details">
        <span class="ip-label">Cracked Client IP</span>
        <span class="ip-text" id="cracked-ip">laurel-recite.tun.ply.gg</span>
      </div>
      <button onclick="copyToClipboard('cracked-ip', this)">Copy</button>
    </div>
  </div>

  <script>
    function copyToClipboard(elementId, button) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = button.innerText;
        button.innerText = 'Copied!';
        setTimeout(() => {
          button.innerText = originalText;
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }
  </script>

</body>
</html>
